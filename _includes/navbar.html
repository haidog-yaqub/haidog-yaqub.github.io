<style>
  .navbar-custom {
    background: rgba(0, 0, 0, 0.05);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    transition: background 0.4s ease;
  }

  .navbar-custom .navbar-brand {
    color: rgba(0, 0, 0, 1);
    font-size: 1.34rem;
    font-weight: 500;
    margin-bottom: 0 !important;
    margin-left: 0;
    padding: 0;
  }

  .navbar-brand-pill {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 0.32rem 0.9rem;
    background: transparent;
    box-shadow: none;
    transition: transform 0.22s ease;
  }

  .navbar-custom .navbar-brand:hover .navbar-brand-pill {
    background: transparent;
    box-shadow: none;
    transform: translateY(-1px);
  }

  .brand-name-rotator {
    position: relative;
    display: inline-block;
    width: 10.8rem;
    height: 1.5em;
    font-size: 1.1em;
    overflow: hidden;
    font-weight: 700;
    letter-spacing: 0.012em;
    color: rgba(0, 0, 0, 0.85);
    text-shadow: none;
    font-family: "Caveat", cursive;
  }

  .brand-name-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    transition:
      opacity 560ms cubic-bezier(0.2, 0.9, 0.2, 1),
      transform 560ms cubic-bezier(0.2, 0.9, 0.2, 1),
      filter 560ms cubic-bezier(0.2, 0.9, 0.2, 1);
    will-change: opacity, transform, filter;
    color: inherit !important;
    -webkit-text-fill-color: currentColor;
    opacity: 0;
    transform: scale(1.03);
    filter: blur(1.2px);
  }

  .brand-name-layer.is-active {
    opacity: 1;
    transform: scale(1);
    filter: blur(0);
  }

  .brand-name-layer.is-exiting {
    opacity: 0;
    transform: scale(0.985);
    filter: blur(1.4px);
  }


  .navbar-custom .nav-link {
    color: rgba(0, 0, 0, 0.6);
    font-size: 1.1rem;
    font-weight: 500;
    border-radius: 999px;
    padding: 0.32rem 0.9rem;
    transition: color 0.22s ease, background-color 0.22s ease, box-shadow 0.22s ease, transform 0.22s ease;
  }

  .navbar-custom .nav-link:hover {
    color: rgba(0, 0, 0, 1);
    background: rgba(255, 255, 255, 0.52);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    transform: translateY(-1px);
  }

  .navbar-custom .nav-item.active .nav-link {
    color: rgba(0, 0, 0, 1);
    background: rgba(255, 255, 255, 0.74);
    box-shadow: 0 8px 18px rgba(25, 35, 60, 0.08), inset 0 0 0 1px rgba(255, 255, 255, 0.65);
  }

  .navbar-custom.navbar-expand .navbar-nav .nav-link {
  padding-inline: 1.05rem;
}

  /* Add a bit more space between Home / Research / Music */
  .navbar-custom .navbar-nav {
    column-gap: 0.35rem;
  }


  /* 小屏优化：允许换行而不是折叠 */
  @media (max-width: 576px) {
    .brand-name-rotator {
      width: 7.3rem;
    }

    .brand-name-layer {
      justify-content: flex-start;
    }

    .navbar-custom .navbar-brand {
      margin-right: 0.25rem !important;
      margin-bottom: 0 !important;
      font-size: 1rem;
    }

    .navbar-brand-pill {
      padding: 0.28rem 0.65rem 0.28rem 0.2rem;
    }

    .navbar-custom .nav-link {
      font-size: 0.95rem;
      padding: 0.28rem 0.65rem;
    }

    .navbar-custom.navbar-expand .navbar-nav .nav-link {
      padding-inline: 0.72rem;
    }

    .navbar-nav {
      flex-wrap: nowrap;
      justify-content: flex-end;
      column-gap: 0.2rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .brand-name-layer {
      transition: none;
      transform: none;
      filter: none;
    }
  }

  /* 给页面内容留出 navbar 高度 */
  body {
    padding-top: 72px;
  }
</style>

<nav class="navbar navbar-expand navbar-custom fixed-top mb-5 shadow-sm">
  <div class="container px-3" style="max-width: 1700px;">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-lg-10 d-flex justify-content-between align-items-center">

        <a class="navbar-brand d-inline-flex align-items-center mr-2 mb-1 mb-lg-0" href="{{ '/' | relative_url }}">
          <span class="navbar-brand-pill">
            <span id="brand-name-rotator" class="brand-name-rotator">
              <span id="brand-name-current" class="brand-name-layer is-active">海家瑞</span>
              <span id="brand-name-next" class="brand-name-layer brand-name-layer-next"></span>
            </span>
          </span>
        </a>

        <div class="navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ml-auto flex-row">
            {% for item in site.data.navigation.pages %}
            <li class="nav-item {% if item.name == page.navbar_title %}active{% endif %}">
              <a class="nav-link" href="{{ item.url | relative_url }}">
                {{ item.name }}
              </a>
            </li>
            {% endfor %}
          </ul>
        </div>

      </div>
    </div>
  </div>
</nav>

<script>
  (function () {
    var rotator = document.getElementById('brand-name-rotator');
    var currentEl = document.getElementById('brand-name-current');
    var nextEl = document.getElementById('brand-name-next');
    if (!rotator || !currentEl || !nextEl) return;

    var names = ["Jerry", "海家瑞", "Yaqub", "يعقوب"];
    var idx = 0;
    var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var isAnimating = false;

    function getFontFamilyForText(text) {
      if (/[\u0600-\u06FF]/.test(text)) {
        return '"Amiri", "Noto Naskh Arabic", "Noto Sans Arabic", serif';
      }
      if (/[\u3400-\u9FFF]/.test(text)) {
        return '"Ma Shan Zheng", "PingFang SC", "Hiragino Sans GB", cursive';
      }
      return '"Caveat", cursive';
    }

    function applyLayerFont(layer, text) {
      layer.style.fontFamily = getFontFamilyForText(text);
    }

    currentEl.textContent = names[idx];
    applyLayerFont(currentEl, names[idx]);

    if (reduceMotion) {
      return;
    }

    nextEl.textContent = names[idx];
    applyLayerFont(nextEl, names[idx]);
    var layers = [currentEl, nextEl];
    var activeLayerIndex = 0;

    function rotateName() {
      if (isAnimating) return;
      isAnimating = true;

      idx = (idx + 1) % names.length;
      var nextLayerIndex = activeLayerIndex === 0 ? 1 : 0;
      var activeLayer = layers[activeLayerIndex];
      var nextLayer = layers[nextLayerIndex];

      nextLayer.textContent = names[idx];
      applyLayerFont(nextLayer, names[idx]);
      nextLayer.classList.remove('is-active');
      activeLayer.classList.remove('is-active');

      activeLayer.classList.add('is-exiting');

      // Apple-style transition: fade out current, then softly fade in next.
      setTimeout(function () {
        nextLayer.classList.add('is-active');
        activeLayer.classList.remove('is-exiting');
        activeLayerIndex = nextLayerIndex;
        isAnimating = false;
      }, 300);
    }

    setInterval(rotateName, 3600);
  })();
</script>
