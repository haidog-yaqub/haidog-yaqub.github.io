<style>
.navbar-custom {
  background: rgba(0, 0, 0, 0.05);
  backdrop-filter: blur(14px) saturate(160%);
  -webkit-backdrop-filter: blur(14px) saturate(160%);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
  box-shadow: 0 4px 20px rgba(0,0,0,0.05);
  color: white;
  transition: background 0.4s ease;
}

.navbar-custom .navbar-brand {
  color: rgba(0, 0, 0, 1.0);
  font-size: 1.1rem;
  font-weight: 500;
}

/* nav links */
.navbar-custom .nav-link {
  color: rgba(0, 0, 0, 0.5);
  font-size: 1.1rem;
  font-weight: 500;
  transition: color 0.2s ease;
}

.navbar-custom .nav-link:hover {
  color: rgba(0, 0, 0, 1.0);
  font-weight: 500;
}

.navbar-custom .nav-item.active .nav-link {
  color: rgba(0, 0, 0, 1.0);
  font-weight: 500;
  border-bottom: 2px solid rgba(0, 0, 0, 0.5);
  padding-bottom: 2px;
}

/* toggler */
.navbar-custom .custom-toggler {
  border: none;
  background: transparent;
  color: rgba(0, 0, 0, 0.50);
  font-size: 1.4rem;
  padding: 0.35em 0.45em;
  transition: color 0.25s ease, transform 0.25s ease;
}

.navbar-custom .custom-toggler:hover {
  color: rgba(0, 0, 0, 1.0);
  transform: scale(1.05);
}

.navbar-custom .custom-toggler:focus {
  outline: none;
  box-shadow: none;
}

</style>

<!-- <nav class="navbar navbar-expand-sm navbar-custom fixed-top mb-5 shadow-sm"> -->
<nav class="navbar navbar-expand navbar-custom fixed-top mb-5 shadow-sm">
  <div class="container pl-4 pr-0" style="max-width: 1700px;">
    <div class="row w-100 justify-content-center">
      <div class="col-12 col-lg-10 d-flex flex-wrap justify-content-between align-items-center">

        <a class="navbar-brand d-inline-flex align-items-end" href="{{ '/' | relative_url }}">
          <strong style="margin-right: 0.4em;">{{ site.data.profile.navbar_name }}</strong>
        </a>

        <button class="navbar-toggler custom-toggler"
          type="button"
          data-toggle="collapse"
          data-target="#navbarResponsive"
          aria-controls="navbarResponsive"
          aria-expanded="false"
          aria-label="Toggle navigation">
          <i class="fas fa-bars"></i>
        </button>


        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ml-auto">
            {% for item in site.data.navigation.pages %}
            <li class="nav-item {% if item.name == page.navbar_title %}active{% endif %}">
              <a class="nav-link" href="{{ item.url | relative_url }}">{{ item.name }}</a>
            </li>
            {% endfor %}
          </ul>
        </div>

      </div>
    </div>
  </div>
</nav>
