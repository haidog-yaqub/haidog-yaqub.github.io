short_bio: >-
  <div class="my-1">
    <p>
      I'm <strong>HigoBeatz</strong>, a music producer. I cook up beats, MIDI loops, and SFX, and sometimes drop production tutorials for fellow producers.
    </p>
    <p>
      My music has racked up over 5 million plays across Chinese social media, with production credits and collaborations alongside some of the biggest names in Chinese hip-hop. I'm also a co-founder of Innersup Records. Back at Tsinghua, I founded and led the production team for the university's Hip-hop Association.
    </p>
    <p class="mb-0">
      These days, I'm bringing my producer side into my research in audio AI. I'm exploring how AI can open up new ways to create, not just by generating sounds, but by giving artists more ways to shape, control, and play with them.
    </p>
  </div>

